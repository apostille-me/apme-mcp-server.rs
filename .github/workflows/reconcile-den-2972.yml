# Publish the tested resolver lock and canonical formatting; workflow edits are
# applied separately through the connected repository API.
name: reconcile DEN-2972 branch

on:
  push:
    branches:
      - agent/den-2972-official-rmcp-pilot
    paths:
      - .github/workflows/reconcile-den-2972.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2972-official-rmcp-pilot
          persist-credentials: true
          show-progress: false

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Generate and publish the exact tested dependency state
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 >/dev/null
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          grep -Fq '#458419497de273d2ca6089a727f38894083d8da6"' Cargo.lock
          grep -Fq 'ExactProtocol::new' src/main.rs
          grep -Fq 'exact_protocol_wrapper_rejects_preview_and_legacy_versions' tests/stdio_conformance.rs
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock Cargo.toml src tests
          git commit -m 'chore(DEN-2972): commit exact shared lock and formatting'
          git push origin HEAD:agent/den-2972-official-rmcp-pilot
