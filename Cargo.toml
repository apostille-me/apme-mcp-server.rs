[package]
name = "apme-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only MCP stdio server for the apostille-me organization"
license = "MIT"
publish = false
repository = "https://github.com/apostille-me/apme-mcp-server.rs"

[dependencies]
ore-mcp-runtime = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "458419497de273d2ca6089a727f38894083d8da6" }
ore-mcp-zed-graph = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "458419497de273d2ca6089a727f38894083d8da6" }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ore-mcp-testkit = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "458419497de273d2ca6089a727f38894083d8da6" }
