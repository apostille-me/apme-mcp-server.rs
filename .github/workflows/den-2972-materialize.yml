name: DEN-2972 materialize official-rmcp pilot

on:
  push:
    branches:
      - agent/den-2972-official-rmcp-pilot
    paths:
      - .github/workflows/den-2972-materialize.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2972-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'apostille-me/apme-mcp-server.rs' &&
      github.actor == 'ORESoftware' &&
      github.ref == 'refs/heads/agent/den-2972-official-rmcp-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pilot branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2972-official-rmcp-pilot
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Install canonical MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Generate and validate exact resolution
        run: |
          set -euo pipefail
          cargo +1.88.0 generate-lockfile
          cargo +1.88.0 metadata --locked --format-version 1 >/dev/null
      - name: Check format and strict lint
        run: |
          set -euo pipefail
          cargo +1.88.0 fmt --all -- --check
          cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Run unit and real-process conformance tests
        run: cargo +1.88.0 test --locked --all-targets --all-features
      - name: Commit generated lock and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add Cargo.lock
          git rm .github/workflows/den-2972-materialize.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-2972): materialize exact official-rmcp lockfile'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/agent/den-2972-official-rmcp-pilot
