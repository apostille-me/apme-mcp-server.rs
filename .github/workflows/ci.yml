name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Validate committed Rust lock and immutable shared revision
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          grep -Fq 'rev = "652eee6538eae8c286b70593d3da574c3da741de"' Cargo.toml
          grep -Fq '#652eee6538eae8c286b70593d3da574c3da741de"' Cargo.lock
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Validate canonical Zed dependencies
        shell: bash
        run: |
          set -euo pipefail
          for dependency in \
            apostille-me/apme-clients \
            apostille-me/apme-interfaces \
            apostille-me/apme-libs \
            apostille-me/apme-cli \
            apostille-me/apme-sync \
            shared-auth/shared-auth-clients
          do
            grep -Fq "\"${dependency}\"" .zpkg.toml
          done
          grep -Fq 'dir = ".vendor/.zed"' .zpkg.toml
      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- Cargo.lock
