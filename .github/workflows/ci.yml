name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Reject credential-like tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- . ':!Cargo.lock'; then
            echo 'credential-like tracked content detected' >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check
      - name: Lint
        run: cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test protocol and security boundaries
        run: cargo +1.88.0 test --locked --all-targets --all-features
      - name: Build release
        run: cargo +1.88.0 build --locked --release
      - name: Install pinned RustSec scanner
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo +1.88.0 audit --deny warnings
