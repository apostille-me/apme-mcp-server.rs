name: reconcile DEN-2972 branch

on:
  push:
    branches:
      - agent/den-2972-official-rmcp-pilot
    paths:
      - .github/workflows/reconcile-den-2972.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2972-official-rmcp-pilot
          persist-credentials: true
          show-progress: false

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Reconcile immutable revision, lock, formatting, and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '652eee6538eae8c286b70593d3da574c3da741de': '458419497de273d2ca6089a727f38894083d8da6',
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c': 'dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected CI anchor missing: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f Cargo.lock
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 >/dev/null
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          grep -Fq '#458419497de273d2ca6089a727f38894083d8da6"' Cargo.lock
          grep -Fq 'ExactProtocol::new' src/main.rs
          grep -Fq 'exact_protocol_wrapper_rejects_preview_and_legacy_versions' tests/stdio_conformance.rs

          rm .github/workflows/reconcile-den-2972.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(DEN-2972): reconcile exact shared lock and CI anchors'
          git push origin HEAD:agent/den-2972-official-rmcp-pilot
