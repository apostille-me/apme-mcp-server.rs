name: Zed package artifact

on:
  pull_request:
    paths:
      - .github/workflows/zed-lock-canary.yml
      - .zpkg.toml
      - .zpkg.lock
      - Cargo.toml
      - Cargo.lock
      - src/**
  push:
    branches: [main]
    paths:
      - .github/workflows/zed-lock-canary.yml
      - .zpkg.toml
      - .zpkg.lock
      - Cargo.toml
      - Cargo.lock
      - src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_VERSION: 0.2.3
  ZED_ASSET_SHA256: b8f81a8e4943cbaeb47153386819a911dcf02666a8709c5bd013e4f35b1ba1b9

jobs:
  artifact:
    name: Pack, install, and run the released artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install released Zed CLI with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          asset="zed-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$asset" \
            "https://github.com/zed-pkg/zed-cli/releases/download/v${ZED_VERSION}/$asset"
          printf '%s  %s\n' "$ZED_ASSET_SHA256" "$RUNNER_TEMP/$asset" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/zed" --version)" = "zed ${ZED_VERSION}"

      - name: Validate package metadata and installed-consumer behavior
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zed" validate
          "$RUNNER_TEMP/zed" r2g --clean
