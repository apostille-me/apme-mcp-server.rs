name: exact rmcp runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-rmcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SHARED_MCP_REV: c6101656c8227251d1dbd61df54f03a186b42ade

jobs:
  runtime:
    name: Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, 1.97.1]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Validate immutable dependency state
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          test "$(grep -Fc "rev = \"${SHARED_MCP_REV}\"" Cargo.toml)" -eq 1
          grep -Fq 'ores-mcp-server-core-libs' Cargo.toml
          grep -Fq "#${SHARED_MCP_REV}\"" Cargo.lock
          grep -Fq 'version = "=3.1.4"' Cargo.toml
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run unit and real-process conformance tests
        run: cargo test --locked --all-targets --all-features

      - name: Ratchet official dispatch and supported protocol floor
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ProtocolVersion::V_2026_07_28' src/server.rs
          grep -Fq 'ProtocolVersion::V_2025_06_18' src/server.rs
          grep -Fq 'tracing::instrument' src/server.rs
          grep -Fq 'real_process_negotiates_and_lists_namespaced_tools_without_stdout_noise' tests/stdio_integration.rs
          if grep -R -F 'read_line' src || grep -R -F 'println!' src; then
            echo 'manual protocol parsing or stdout diagnostics detected' >&2
            exit 1
          fi

      - name: Verify dependency state remained unchanged
        run: git diff --exit-code -- Cargo.lock
